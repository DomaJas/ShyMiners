<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#23262e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Карта магазинов</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--top:56px}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;margin:0;width:100%;background:#1b1d23;color:#eee;font-family:system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));
  background:#23262e;display:flex;gap:8px;box-shadow:0 2px 8px #0008}
#top button{height:42px;border:0;border-radius:8px;background:#3a3f4b;color:#fff;font-size:15px;cursor:pointer;padding:0 14px;white-space:nowrap}
#top button:active{background:#4a505e}
#top button.on{background:#d4a800;color:#111;font-weight:600}
#x{width:44px;padding:0!important;font-size:18px!important}
#q{flex:1;min-width:0;height:42px;padding:0 14px;border-radius:8px;border:1px solid #444;background:#15171c;color:#fff;font-size:16px;
  -webkit-user-select:text;user-select:text}
#all .m{display:none}
#zm{position:fixed;left:10px;top:calc(var(--top) + 10px);z-index:3;display:flex;flex-direction:column;gap:6px}
#zm button{width:46px;height:46px;border:0;border-radius:10px;background:#23262eee;color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 2px 8px #0008}
#zm button:active{background:#4a505e}
#res{position:fixed;top:calc(var(--top) + 6px);left:10px;width:min(440px,calc(100% - 20px));max-height:55vh;overflow:auto;
  -webkit-overflow-scrolling:touch;background:#23262e;border-radius:8px;display:none;z-index:5;box-shadow:0 4px 16px #000a}
.r{padding:12px;border-bottom:1px solid #333;cursor:pointer}.r:hover{background:#2e323d}
#view{position:absolute;inset:0;overflow:hidden;contain:strict;touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#map{display:block;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none}
#svg{position:absolute;left:0;top:0}
#ov{position:absolute;left:0;top:0;width:0;height:0}
.shop{fill:rgba(255,255,255,.01);stroke:transparent;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
#svg.all .shop{fill:rgba(255,215,0,.28);stroke:gold}
@media(hover:hover){#svg .shop:hover{fill:rgba(255,215,0,.45);stroke:gold}}
#svg .shop.hit{stroke:#4f8;fill:rgba(80,255,120,.4);animation:p .8s infinite alternate}
@keyframes p{to{fill:rgba(80,255,120,.8)}}
.zone{cursor:pointer}
.mk{position:absolute;width:0;height:0;transform-origin:0 0;pointer-events:none}
.mkimg{position:absolute;left:-16px;top:-32px;width:32px;height:32px;image-rendering:pixelated;pointer-events:auto;
  cursor:pointer;filter:drop-shadow(0 1px 2px #000)}
.mklab{position:absolute;left:0;top:4px;transform:translateX(-50%);white-space:nowrap;color:#fff;
  font:600 12px/1.25 system-ui,sans-serif;text-align:center;text-shadow:0 0 3px #000,0 0 2px #000;pointer-events:none}
.zl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;
  font:700 14px/1.2 system-ui,sans-serif;text-align:center;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
#panel,#layers{position:fixed;right:10px;top:calc(var(--top) + 10px);width:340px;max-height:calc(100% - var(--top) - 24px);
  overflow:auto;-webkit-overflow-scrolling:touch;background:#23262e;border-radius:10px;padding:14px;z-index:4;display:none;
  box-shadow:0 4px 16px #000a}
#panel h2,#layers h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#panel h2 span,#layers h2 span{cursor:pointer;color:#aaa;font-size:22px;line-height:1;padding:4px 8px;margin:-4px -8px 0 0}
.it{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px}.it.m{background:#2c4a35}
.ic{width:32px;height:32px;image-rendering:pixelated;flex:none}.pr .ic{width:20px;height:20px;vertical-align:middle}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}.e{color:#c9a0ff;font-size:13px;font-style:italic}.pr{white-space:nowrap;font-weight:600}
.rr{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px;flex-wrap:wrap}.rr .ic{width:20px;height:20px}
.grp{border-top:1px solid #333;padding:8px 0}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.gh button{background:#3a3f4b;color:#fff;border:0;border-radius:6px;padding:4px 8px;font-size:13px;margin-left:4px;cursor:pointer}
.lr{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:15px;cursor:pointer}
.lr input{width:20px;height:20px;flex:none}
.lr .ic{width:24px;height:24px}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;flex:none;border:1px solid #0008}
@media(max-width:700px){
  #top{gap:6px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  #top button{padding:0 12px;height:48px;font-size:17px}
  #q{height:48px;font-size:17px}
  #x{width:48px}
  #zm{top:calc(var(--top) + 8px);left:8px}
  #zm button{width:52px;height:52px;font-size:30px}
  #panel h2,#layers h2{font-size:21px}
  .pr{font-size:17px}
  .ic{width:40px;height:40px}
  .pr .ic{width:24px;height:24px}
  .rr{font-size:16px}
  .rr .ic{width:24px;height:24px}
  #all .d{display:none}#all .m{display:inline}
  #res{left:8px;width:calc(100% - 16px);max-height:42vh}
  #panel,#layers{left:0;right:0;top:auto;bottom:0;width:auto;max-height:55vh;border-radius:14px 14px 0 0;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .it{padding:10px 6px;font-size:18px}
  .mkimg{width:40px;height:40px;left:-20px;top:-40px}
  .mklab,.zl{font-size:15px}
  .lr{font-size:18px;padding:10px 2px}
  .lr .ic{width:30px;height:30px}
  .lr input{width:24px;height:24px}
  .gh button{padding:8px 12px;font-size:15px}
}
</style></head><body>
<div id="top"><input id="q" placeholder="Поиск предмета…" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="search">
<button id="all" title="Подсветить все магазины"><span class="d">Подсветить все</span><span class="m">Все</span></button>
<button id="lay" title="Что показывать на карте">Слои</button>
<button id="x" title="Сбросить">✕</button></div>
<div id="zm"><button id="zi" aria-label="Приблизить">+</button><button id="zo" aria-label="Отдалить">−</button></div>
<div id="res"></div>
<div id="view"><div id="world"><img id="map" alt=""><svg id="svg"></svg><div id="ov"></div></div></div>
<div id="panel"></div>
<div id="layers"></div>

  ov.appendChild(el);SCALED.push(el);return el}
const zEls=ZNS.map(z=>{
  const xs=z.p.map(a=>a[0]),ys=z.p.map(a=>a[1]);
  return mkEl((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2,
    z.sn&&z.n?'<div class="zl">'+esc(z.n)+'</div>':'')});
const mEls=MKS.map((m,i)=>{
  const lines=[];if(m.sn&&m.n)lines.push(esc(m.n));if(m.sx)lines.push('('+m.cx+', '+m.cy+')');
  const el=mkEl(m.x,m.y,'<img class="mkimg" alt="" src="'+(D.icons[m.i]||'')+'">'+
    (lines.length?'<div class="mklab">'+lines.join('<br>')+'</div>':''));
  el.querySelector('.mkimg').addEventListener('click',()=>{if(!moved)openMarker(i)});
  return el});
  
function showPanel(title,body){
  layers.style.display='none';$('#lay').classList.remove('on');
  panel.innerHTML='<h2><b>'+title+'</b><span id="cl">✕</span></h2>'+body;
  panel.scrollTop=0;panel.style.display='block';
  $('#cl').onclick=()=>panel.style.display='none';
}
function openShop(i,t){
  const s=SH[i];
  showPanel(esc(s.n),s.items.length?s.items.map(it=>'<div class="it'+(t&&match(it,t)?' m':'')+'">'+icon(it.i)+
    '<div class="t">'+esc(it.l)+(it.e?'<div class="e">'+esc(it.e)+'</div>':'')+'</div><div class="pr">'+price(it)+'</div></div>').join(''):
    '<i>Товаров пока нет</i>');
}
function openMarker(i){
  const m=MKS[i];
  showPanel(esc(m.n),'<div class="it">'+icon(m.i)+'<div class="t">'+esc(m.n)+'<div class="e">('+m.cx+', '+m.cy+')</div></div></div>');
}
function openZone(i){showPanel(esc(ZNS[i].n),'<i>Зона</i>')}

function flyTo(i){
  const xs=SH[i].p.map(a=>a[0]),ys=SH[i].p.map(a=>a[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const z=Math.min(4,Math.max(sc,1.5)),T=TOP();
  const bottom=mob()?innerHeight*.5:innerHeight;
  const right=mob()?innerWidth:innerWidth-360;
  world.style.transition='transform .4s';sc=z;tx=right/2-cx*z;ty=(T+bottom)/2-cy*z;apply();
  setTimeout(()=>world.style.transition='',450);
}

function search(){
  const t=q.value.trim().toLowerCase();let h='';
  polys.forEach((p,i)=>{
    const m=(t&&vis.s[i])?SH[i].items.filter(it=>match(it,t)):[];
    p.classList.toggle('hit',m.length>0);
    if(m.length)h+='<div class="r" data-i="'+i+'"><b>'+esc(SH[i].n)+'</b>'+
      m.map(it=>'<div class="rr">'+icon(it.i)+esc(it.l)+(it.e?' <span class="e">'+esc(it.e)+'</span>':'')+
      ' — <span class="pr">'+price(it)+'</span></div>').join('')+'</div>';
  });
  res.innerHTML=h||(t?'<div class="r">Ничего не найдено</div>':'');res.style.display=t?'block':'none';
}
res.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(!r)return;
  const i=+r.dataset.i;flyTo(i);openShop(i,q.value.trim().toLowerCase());
  if(mob()){res.style.display='none';q.blur()}});
q.addEventListener('input',search);
q.addEventListener('focus',()=>{if(q.value.trim())res.style.display='block'});
q.addEventListener('keydown',e=>{if(e.key=='Enter')q.blur()});

const LABEL={s:'Магазины',m:'Метки',z:'Зоны'};
function buildLayers(){
  const grp=(k,list,ic)=>'<div class="grp"><div class="gh"><b>'+LABEL[k]+'</b><span>'+
    '<button data-bulk="'+k+'" data-v="1">все</button><button data-bulk="'+k+'" data-v="0">нет</button></span></div>'+
    (list.length?list.map((o,i)=>'<label class="lr"><input type="checkbox" data-g="'+k+'" data-i="'+i+'"'+
      (vis[k][i]?' checked':'')+'>'+(ic?ic(o):'')+'<span>'+esc(o.n)+'</span></label>').join(''):'<i>нет</i>')+'</div>';
  layers.innerHTML='<h2>Слои <span id="lc">✕</span></h2>'+
    grp('s',SH)+grp('m',MKS,o=>icon(o.i))+grp('z',ZNS,o=>'<i class="sw" style="background:'+o.c+'"></i>');
  $('#lc').onclick=()=>{layers.style.display='none';$('#lay').classList.remove('on')};
}
layers.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.g!==undefined){vis[t.dataset.g][+t.dataset.i]=t.checked;applyVis()}});
layers.addEventListener('click',e=>{const b=e.target.closest('[data-bulk]');if(!b)return;
  const k=b.dataset.bulk,v=b.dataset.v==='1';
  vis[k]=vis[k].map(()=>v);applyVis();buildLayers()});
$('#lay').onclick=()=>{
  const open=layers.style.display!=='block';
  panel.style.display='none';
  if(open)buildLayers();
  layers.style.display=open?'block':'none';
  $('#lay').classList.toggle('on',open)};

function applyVis(){
  polys.forEach((p,i)=>p.style.display=vis.s[i]?'':'none');
  zPolys.forEach((p,i)=>p.style.display=vis.z[i]?'':'none');
  zEls.forEach((e,i)=>e.style.display=vis.z[i]?'':'none');
  mEls.forEach((e,i)=>e.style.display=vis.m[i]?'':'none');
  if(q.value.trim())search();
}

$('#all').onclick=function(){this.classList.toggle('on',svg.classList.toggle('all'))};
$('#x').onclick=()=>{q.value='';search();panel.style.display='none';layers.style.display='none';$('#lay').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key=='Escape')$('#x').click()});
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
fit();
</script></body></html>
